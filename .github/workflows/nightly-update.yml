name: Nightly watcher

on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST every night
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for news about rule changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watch.mjs
      - name: Save what we have already seen
        run: |
          git config user.name "hr-bot"
          git config user.email "hr-bot@users.noreply.github.com"
          git add content/watch-state.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "bot: watcher state $(date -u +%F)"
            git push
          fi
