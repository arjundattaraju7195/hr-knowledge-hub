name: Nightly HR content check

on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST every night
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every topic for law changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/nightly-update.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "hr-bot"
          git config user.email "hr-bot@users.noreply.github.com"
          git add content/topics.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "bot: nightly content update $(date -u +%F)"
            git push
          fi
